name: Publicar en GitHub Pages

# La app se publica como sitio estático. Vite ya compila con base "./",
# así que funciona igual en la raíz del dominio que en /nombre-del-repo/.
#
# Si en algún momento la app vive en una subcarpeta del repositorio
# (por ejemplo "estudio/"), añade `working-directory: estudio` a los pasos
# de npm y cambia el `path` del artefacto a "estudio/dist".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar contenido y lógica
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
