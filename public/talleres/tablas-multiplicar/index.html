<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabla del 1 · Tablas de multiplicar</title>
  <meta name="description" content="Tablas de multiplicar del 1 al 10, una tabla por hoja A4 lista para imprimir.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#d9e4e2">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Menú de tablas">
      <div class="rail__head">
        <p class="rail__title">Tablas de multiplicar</p>
        <p class="rail__sub">del 1 al 10</p>
      </div>

      <div class="rail__tabs" id="tabs" role="tablist" aria-label="Elige una tabla" aria-orientation="vertical"></div>

      <div class="rail__foot">
        <button class="print" type="button" id="print">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9V3h12v6"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="7" rx="1"/>
          </svg>
          <span class="print__label">Imprimir</span>
        </button>
        <p class="rail__hint">Imprime solo la tabla que ves.</p>
      </div>
    </aside>

    <main class="stage">
      <section class="sheet" id="sheet" role="tabpanel">
        <span class="sheet__margin" aria-hidden="true"></span>
        <div class="sheet__body">
          <header class="sheet__head">
            <h1 class="sheet__title" id="sheetTitle">Tabla del <span class="sheet__n" id="sheetN">1</span></h1>
            <img class="sheet__art" src="assets/capibaras-estudiando.svg" alt="" width="240" height="240">
          </header>
          <div class="table" id="table"></div>
        </div>
      </section>

      <noscript>
        <p class="noscript">Activa JavaScript para ver y cambiar de tabla.</p>
      </noscript>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
